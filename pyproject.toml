[project]
name = "domicilio-web"
version = "0.1.0"
description = "Painel local, somente leitura, das comunicações do Domicílio Judicial Eletrônico"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.scripts]
domicilio-web = "domicilio_web.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domicilio_web"]
